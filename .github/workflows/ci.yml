name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift guard against the live Supermemory SDK and OpenAPI (Mondays 14:00 UTC).
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Typecheck the contract against supermemory@latest
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set +e
          bun run drift:sdk 2>&1 | tee "$RUNNER_TEMP/drift-sdk.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/drift-sdk.exit"
          exit "$code"
      - name: Compare live OpenAPI operations with the pinned snapshot
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set +e
          bun run drift:openapi 2>&1 | tee "$RUNNER_TEMP/drift-openapi.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/drift-openapi.exit"
          exit "$code"
      - name: Report drift issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/report-drift.sh
